name: Publish approved Caribbean AI workshop once

on:
  push:
    paths:
      - '.github/workflows/_publish-approved-once.yml'

permissions:
  contents: read

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EDITORIAL_PUBLISH_SLUG: cpa-uk-unesco-caribbean-ai-workshop
      EDITORIAL_HUMAN_REVIEWER: Flávio
      EDITORIAL_APPROVAL_PHRASE: I APPROVE PUBLICATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require database secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
      - name: Validate publication gate
        run: EDITORIAL_PUBLISH_APPLY=0 npm run editorial:publish
      - name: Publish approved initiative
        run: EDITORIAL_PUBLISH_APPLY=1 npm run editorial:publish
