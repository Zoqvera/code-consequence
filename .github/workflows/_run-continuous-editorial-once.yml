name: Remediate first automated editorial queue

on:
  push:
    paths:
      - '.github/workflows/_run-continuous-editorial-once.yml'

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EDITORIAL_QUEUE_REPORT_PATH: artifacts/editorial-queue/review-queue.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require database secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
      - name: Enforce independent publisher corroboration
        run: EDITORIAL_CORROBORATION_APPLY=1 node scripts/enforce-independent-corroboration.mjs
      - name: Validate remaining automated drafts
        run: EDITORIAL_ADVANCE_APPLY=0 npm run editorial:auto-advance
      - name: Build corrected human approval queue report
        run: npm run editorial:queue-report
      - name: Upload corrected approval queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: editorial-human-approval-queue-corrected
          path: artifacts/editorial-queue
          if-no-files-found: error
          retention-days: 14
