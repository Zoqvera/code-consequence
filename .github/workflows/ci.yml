name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run discovery:validate
      - run: npm run scripts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
