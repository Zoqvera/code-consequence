name: Initialize Neon database

# Temporary push trigger used only to validate the additive editorial-state migration.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/database.yml"
      - "scripts/migrate.mjs"
      - "scripts/verify-db.mjs"
      - "db/schema.sql"
      - "db/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require DATABASE_URL
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
      - name: Apply schema and migrations
        run: npm run db:migrate
      - name: Verify schema
        run: npm run db:verify
