name: Continuous editorial cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: continuous-editorial-cycle
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      ENRICH_BATCH_SIZE: 12
      EDITORIAL_RESEARCH_MODEL: gpt-5.6-luna
      EDITORIAL_RESEARCH_BATCH_SIZE: 4
      EDITORIAL_RESEARCH_RETRY_HOLD_DAYS: 7
      EDITORIAL_ADVANCE_BATCH_SIZE: 10
      RECOVER_SOURCE_LIMIT: 20
      RECOVER_SOURCE_MAX_ATTEMPTS: 3
      INGESTION_USER_AGENT: CodeAndConsequenceBot/0.1
      EDITORIAL_QUEUE_REPORT_PATH: artifacts/editorial-queue/review-queue.json
      EDITORIAL_CYCLE_REPORT_PATH: artifacts/editorial-cycle/cycle-health.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Require repository secrets
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY repository secret is missing" && exit 1)

      - name: Validate discovery configuration
        run: npm run discovery:validate

      - name: Ensure database schema
        run: npm run db:migrate

      - name: Discover source items
        run: npm run ingest:collect

      - name: Restore retryable API billing failures
        run: npm run enrich:recover

      - name: Restore transient source extraction failures
        run: npm run enrich:recover-sources

      - name: Classify the next source batch
        run: npm run enrich:classify

      - name: Refresh editorial candidate clusters
        run: npm run editorial:prepare

      - name: Research and verify initiative candidates
        run: npm run editorial:research

      - name: Validate researched promotion plan
        run: AUTO_PROMOTE_APPLY=0 npm run editorial:auto-promote

      - name: Promote verified research into reviewed drafts
        run: AUTO_PROMOTE_APPLY=1 npm run editorial:auto-promote

      - name: Remediate automated REVIEW items without independent publishers
        run: EDITORIAL_CORROBORATION_APPLY=1 node scripts/enforce-independent-corroboration.mjs

      - name: Validate automatic DRAFT to REVIEW gate
        run: EDITORIAL_ADVANCE_APPLY=0 npm run editorial:auto-advance

      - name: Move eligible reviewed drafts to REVIEW
        run: EDITORIAL_ADVANCE_APPLY=1 npm run editorial:auto-advance

      - name: Research and verify article candidates
        run: npm run editorial:article-research

      - name: Validate researched article promotion plan
        run: EDITORIAL_ARTICLE_PROMOTE_APPLY=0 npm run editorial:article-promote

      - name: Promote verified article research into drafts
        run: EDITORIAL_ARTICLE_PROMOTE_APPLY=1 npm run editorial:article-promote

      - name: Validate automatic article DRAFT to REVIEW gate
        run: EDITORIAL_ARTICLE_ADVANCE_APPLY=0 npm run editorial:article-auto-advance

      - name: Move eligible article drafts to REVIEW
        run: EDITORIAL_ARTICLE_ADVANCE_APPLY=1 npm run editorial:article-auto-advance

      - name: Build initiative human approval queue report
        run: npm run editorial:queue-report

      - name: Upload initiative approval queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: editorial-human-approval-queue
          path: artifacts/editorial-queue
          if-no-files-found: error
          retention-days: 14

      - name: Build article human approval queue report
        run: npm run editorial:article-queue-report

      - name: Upload article approval queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: editorial-article-human-approval-queue
          path: artifacts/editorial-articles
          if-no-files-found: error
          retention-days: 14

      - name: Build editorial cycle health report
        if: always()
        continue-on-error: true
        run: npm run editorial:cycle-report

      - name: Upload editorial cycle health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-cycle-health
          path: artifacts/editorial-cycle
          if-no-files-found: warn
          retention-days: 14
