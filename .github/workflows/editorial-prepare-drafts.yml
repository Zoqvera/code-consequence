name: Prepare initiative drafts for review

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply reviewed organization/region decisions and PT-BR draft translations
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PREPARE_DRAFTS_APPLY: ${{ inputs.apply && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require database secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
      - name: Build preparation plan or apply draft fields
        run: npm run editorial:prepare-drafts
