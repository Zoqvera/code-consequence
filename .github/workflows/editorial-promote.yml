name: Promote verified initiative drafts

# Push trigger is temporary and runs dry-run only; manual dispatch is required for writes.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create or update internal DRAFT initiatives
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-promote.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROMOTE_APPLY: ${{ inputs.apply && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require database secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
      - name: Build promotion plan or create drafts
        run: npm run editorial:promote
