name: Dry run publication gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EDITORIAL_PUBLISH_SLUG: thailand-ai-readiness-assessment-unesco-ram
      EDITORIAL_HUMAN_REVIEWER: DRY_RUN_VALIDATION
      EDITORIAL_APPROVAL_PHRASE: I APPROVE PUBLICATION
      EDITORIAL_PUBLISH_APPLY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require database secret
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
      - name: Validate final publication gate without writing
        run: npm run editorial:publish
