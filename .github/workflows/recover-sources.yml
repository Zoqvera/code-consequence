name: Recover source extraction errors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-sources.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      RECOVER_SOURCE_LIMIT: 20
      ENRICH_BATCH_SIZE: 20
      INGESTION_USER_AGENT: CodeAndConsequenceBot/0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require secrets
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL repository secret is missing" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY repository secret is missing" && exit 1)
      - name: Requeue recoverable source errors
        run: npm run enrich:recover-sources
      - name: Retry classification with resilient extractor
        run: npm run enrich:classify
